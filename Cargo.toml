[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# The recommended Clippy gate passes `-D warnings`, so warn-level groups fail it.
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
