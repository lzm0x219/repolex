# Stable rustfmt settings for the workspace (Rust 1.97.1).
# Run: cargo fmt --all
# Unstable rustfmt options are intentionally omitted to stay on stable Rust.

edition = "2024"
style_edition = "2024"

newline_style = "Unix"

use_field_init_shorthand = true
use_try_shorthand = true
match_block_trailing_comma = true
